<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Escola de Treinamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="menu">
        <h1>Escola de Treinamentos Online</h1>
        <nav>
            <a href="index.html">Cursos</a>
            <a href="matricula.html">Matrícula</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <div class="conteudo">
        <h2>Fale Conosco</h2>
        <p>Envie sua dúvida ou sugestão através do formulário abaixo:</p>
        
        <form action="#" method="POST" class="form-matricula">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" name="assunto" placeholder="Ex: Dúvida sobre certificado">

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </div>

    <footer>
        <div class="conteudo-footer">
            <p>&copy; 2026 Escola de Treinamentos Online. Todos os direitos reservados.</p>
            <p>Contato: contato@escolatreinamentos.com.br | (11) 99999-9999</p>
        </div>
    </footer>
</body>
</html>
