<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula - Escola de Treinamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="menu">
        <h1>Escola de Treinamentos Online</h1>
        <nav>
            <a href="index.html">Cursos</a>
            <a href="matricula.html">Matrícula</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <div class="conteudo">
        <h2>Formulário de Matrícula</h2>
        <form action="#" method="POST" class="form-matricula">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefone">Telefone/Celular:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">

            <label for="curso">Escolha seu Curso:</label>
            <select id="curso" name="curso" required>
                <option value="">Selecione...</option>
                <option value="java">Java Intermediário</option>
                <option value="web">Front-end</option>
                <option value="sql">Banco de Dados SQL</option>
            </select>

            <button type="submit">Efetuar Matrícula</button>
        </form>
    </div>

    <footer>
        <div class="conteudo-footer">
            <p>&copy; 2026 Escola de Treinamentos Online. Todos os direitos reservados.</p>
            <p>Contato: contato@escolatreinamentos.com.br | (11) 99999-9999</p>
        </div>
    </footer>
</body>
</html>
