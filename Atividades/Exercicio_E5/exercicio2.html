<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <style>
        body {
            font-family: Arial;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }

        #painel {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            width: 500px;
            background-color: white;
        }

        ul {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="painel">
        <h3>Adicionar Link</h3>

        <div class="mb-3">
            <label class="form-label">Descrição do Link</label>
            <input type="text" id="descricao" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Endereço do Link</label>
            <input type="text" id="endereco" class="form-control">
        </div>

        <button class="btn btn-primary" onclick="adicionar()">
            Adicionar
        </button>

        <hr>

        <ul id="lista"></ul>
    </div>

    <script>
        function adicionar() {
            const descricao = document.getElementById("descricao").value;
            const endereco = document.getElementById("endereco").value;
            if (descricao !== "" && endereco !== "") {
                const li = document.createElement("li");
                const link = document.createElement("a");
                link.href = endereco;
                link.textContent = descricao;
                link.target = "_blank";
                li.appendChild(link);
                document.getElementById("lista").appendChild(li);
                document.getElementById("descricao").value = "";
                document.getElementById("endereco").value = "";
            }
        }
    </script>
</body>
</html>
