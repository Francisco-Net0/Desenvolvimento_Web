<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <style>
        body {
            font-family: Arial;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f5f5f5;
        }

        #painel {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            width: 400px;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="painel">
        <h3>Adicionar Opção</h3>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" id="descricao" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Valor</label>
            <input type="text" id="valor" class="form-control">
        </div>

        <button class="btn btn-primary" onclick="adicionar()">
            Adicionar
        </button>

        <hr>

        <select id="combo" class="form-select"></select>
    </div>

    <script>
        function adicionar() {
            const descricao = document.getElementById("descricao").value;
            const valor = document.getElementById("valor").value;
            if (descricao !== "" && valor !== "") {
                const option = document.createElement("option");
                option.text = descricao;
                option.value = valor;
                document.getElementById("combo").appendChild(option);
                document.getElementById("descricao").value = "";
                document.getElementById("valor").value = "";
            }
        }
    </script>
</body>
</html>
