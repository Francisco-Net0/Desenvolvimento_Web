<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Barbearia</title>
    <link rel="icon" href="img/bigode.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header d-flex align-items-center">
                <i class="bi bi-person-gear fs-3 me-2 text-warning"></i>
                <h4 class="mb-0 fw-bold">Painel Admin</h4>
            </div>
            <ul class="list-unstyled components mt-3">
                <li class="active">
                    <a href="#"><i class="bi bi-list-task me-2"></i> Agenda</a>
                </li>
                <li>
                    <a href="#"><i class="bi bi-scissors me-2"></i> Serviços</a>
                </li>
                <li>
                    <a href="#"><i class="bi bi-graph-up me-2"></i> Relatórios</a>
                </li>
                <hr class="border-secondary mx-3">
                <li>
                    <a href="index.html" class="text-danger"><i class="bi bi-box-arrow-left me-2"></i> Sair</a>
                </li>
            </ul>
        </nav>
        <main id="content">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <h2 class="fw-bold text-dark m-0">Lista de Agendamentos</h2>
                <button class="btn btn-warning" onclick="getAgendamentos()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
                </button>
            </div>
            <div class="card card-dash">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="py-3">Barbeiro</th>
                                    <th class="py-3">Cliente</th>
                                    <th class="py-3">Telefone</th>
                                    <th class="py-3">Data</th>
                                    <th class="py-3">Horário</th>
                                    <th class="py-3">Status</th>
                                    <th class="py-3 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="dadosTabela">
                                <tr>
                                    <td colspan="8" class="text-center py-4">
                                        <div class="spinner-border text-warning" role="status">
                                            <p class="mt-2 text-muted">Carregando agendamentos...</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
