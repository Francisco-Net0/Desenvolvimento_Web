<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 01</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <style>
        body {
            font-family: 'Arial';
        }

        #titulo {
            margin-top: 20px;
            text-align: center;
        }

        #subtitulo {
            text-align: center;
            font-size: 30px
        }

        button {
            margin-top: 15px;
            margin-right: 10px;
        }

        .nova-div {
            border-radius: 5px;
            border: var(--bs-border-width) solid var(--bs-border-color);
            width: 100%;
            word-wrap: break-word;
            padding: 10px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="titulo"> Exercicio 01</h1>

        <label for="">Digite um texto:</label>
        <textarea class="form-control" id="texto"></textarea>
        <div class="d-flex justify-content-center">
            <button class="btn btn-primary mb-3" type="button" id="btnSalvar" onclick="salvar()">Salvar Texto</button>
        </div>

        <hr>

        <div id="listar"></div>

        <div class="d-flex justify-content-center">
            <button class="btn btn-primary mb-3" type="button" onclick="aumentar()">(+) Aumentar Tamanho</button>
            <button class="btn btn-warning mb-3" type="button" onclick="diminuir()">(-) Diminuir Tamanho</button>
            <button class="btn btn-success mb-3" type="button" onclick="negrito()">(B) Negrito</button>
            <button class="btn btn-danger mb-3" type="button" onclick="italico()">(I) Italico</button>
        </div>
    </div>

    <script>
        function salvar() {
            const texto = document.getElementById("texto").value
            const resultado = document.getElementById("listar")
            // Veriica se existi o p, e cria
            let novoP = document.getElementById("resul")
            if(novoP == null) {
                const novaDiv = document.createElement("div")
                novaDiv.classList.add("nova-div")
                novoP = document.createElement("p")
                novoP.id = "resul"
                novaDiv.append(novoP)
                resultado.append(novaDiv)
            } 

            // senao apenas altera o texto
            novoP.textContent = texto
            document.getElementById("texto").value = ""
        }

        function aumentar() {
            const resultado = document.getElementById("resul")
            let tamanhoAtual = parseInt(window.getComputedStyle(resultado).fontSize)
            resultado.style.fontSize = (tamanhoAtual + 1) + "px"
        }

        function diminuir() {
            const resultado = document.getElementById("resul")
            let tamanhoAtual = parseInt(window.getComputedStyle(resultado).fontSize)
            resultado.style.fontSize = (tamanhoAtual - 1) + "px"
        }

        function negrito() {
            const resultado = document.getElementById("resul")
            if (resultado.style.fontWeight === "bold") {
                resultado.style.fontWeight = "normal"
            } else {
                resultado.style.fontWeight = "bold"
            }
        }

        function italico() {
            const resultado = document.getElementById("resul")
            if (resultado.style.fontStyle === "italic") {
                resultado.style.fontStyle = "normal"
            } else {
                resultado.style.fontStyle = "italic"
            }
        }
    </script>
</body>

</html>
