<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    h1 {
      text-align: center;
      margin: 30px 0;
    }

    .input-group-melhorada {
      width: 50%;
      margin: 0 auto 15px auto;
      /* Centraliza horizontalmente e dá margem inferior */
    }

    #div_resultado {
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Conversor de Dólar</h1>
    <div class="mb-3">
      <div class="input-group input-group-melhorada">
        <input type="number" id="valorDolar" class="form-control" placeholder="Digite um valor em Real (R$)"
          step="0.01">
        <button class="btn btn-primary" onclick="Converter()">Converter</button>
      </div>
      <div id="div_resultado"></div>
    </div>
  </div>

  <script>
    function Converter() {
      // 1. Captura os elementos do HTML
      const valorReal = parseFloat(document.getElementById("valorDolar").value);
      const div_resultado = document.getElementById("div_resultado");

      // 2. Valida se o usuário digitou um número válido
      if (isNaN(valorReal) || valorReal <= 0) {
        div_resultado.innerHTML = "<span class='text-danger'> Por favor, insira um valor válido.</span>";
        return;
      }

      // 3. Define a cotação fixa e faz o cálculo
      const cotacaoDolar = 5.10;
      const valorDolar = valorReal * cotacaoDolar;

      // 4. Exibe o resultado formatado na tela
      div_resultado.innerHTML = `R$ ${valorReal.toFixed(2)} equivale a US$ ${valorDolar.toFixed(2)}`;
    }
  </script>
</body>

</html>
