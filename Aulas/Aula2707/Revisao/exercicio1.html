<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    h1 {
      text-align: center;
      margin: 30px 0;
    }

    hr {
      margin: 50px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lista de Compras</h1>
    <div class="mb-3">
      <div class="input-group">
        <input type="text" id="item_lista" class="form-control" placeholder="Digite um item">
        <button class="btn btn-primary" onclick="Adicionar()">Adicionar</button>
      </div>
    </div>
    <hr>
    <ul id="result-list" class="list-group"></ul>
  </div>

  <script>
    let lista_Compras = [];

    function Adicionar() {
      const input = document.getElementById("item_lista");
      const item = input.value.trim();
      if (item == "") {
        alert("Digite um item!");
        input.focus();
        return;
      }
      lista_Compras.push(item);
      MostrarLista();
      input.value = "";
      input.focus();
    }

    function MostrarLista() {
      const resultado = document.getElementById("result-list");
      resultado.innerHTML = "";
      lista_Compras.forEach(function (item) {
        resultado.innerHTML += `
            <li class="list-group-item">
                ${item}
            </li>
        `;
      });
    }

  </script>
</body>

</html>
