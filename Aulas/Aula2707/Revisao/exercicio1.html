<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    h1 {
      text-align: center;
      margin: 30px 0;
    }

    hr {
      margin: 50px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lista de Compras</h1>

    <div class="mb-3">
      <div class="input-group">
        <input type="text" id="item_lista" class="form-control" placeholder="Digite um item">
        <button type="button" class="btn btn-primary" onclick="Adicionar()">Adicionar</button>
      </div>
    </div>

    <hr>

    <ul id="result-list" class="list-group"></ul>
  </div>

  <script>
    let lista_Compras = [];

    function Adicionar() {
      // Captura o campo de texto
      const inputItem = document.getElementById("item_lista");
      // Obtém o texto digitado
      const textoItem = inputItem.value.trim();
      // Não permite itens vazios
      if (textoItem === "") {
        alert("Digite um item!");
        inputItem.focus();
        return;
      }
      // Adiciona ao array
      lista_Compras.push(textoItem);
      // Seleciona a lista
      const resultado = document.getElementById("result-list");
      // Cria um novo <li>
      const novoItem = document.createElement("li");
      // Adiciona a classe Bootstrap
      novoItem.className = "list-group-item";
      // Insere o texto
      novoItem.textContent = textoItem;
      // Adiciona o <li> na <ul>
      resultado.appendChild(novoItem);
      // Limpa o campo
      inputItem.value = "";
      // Retorna o foco para o input
      inputItem.focus();
    }
  </script>
</body>
</html>
