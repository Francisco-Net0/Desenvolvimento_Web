<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 01/06 - GitHub</title>
</head>
<body>
    <script type="text/javascript">
        window.onload = function() {
            githubAPI();
        }
        async function githubAPI() {
            const url = "https://api.github.com/users/rafaelwendel";
            const req = await fetch(url);
            const dados = await req.json(); // converter o json retornado
            console.log(dados.name);
        }
    </script>
</body>
</html>
