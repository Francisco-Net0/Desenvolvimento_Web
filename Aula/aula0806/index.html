<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 08/06</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <style>
        h1 {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        input {
            margin: 5px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            margin: 5px;
            padding: 10px;
            width: 200px;
            box-sizing: border-box;
        }

        table {
            margin-top: 50px
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Lista de Tarefas (Supabase)</h1>

        <div class="text-center">
            <input type="text" id="tarefa" class="form-control mb-2" placeholder="Digite uma tarefa">
            <button class="btn btn-primary" onclick="adicionarTarefa()">Adicionar</button>
        </div>

        <table class="table table-bordered ">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Prioridade</th>
                </tr>
            </thead>
            <tbody id="dadosTabelas"></tbody>
        </table>
    </div>

    <script>
        const url = "https://dgpgyhvgxwkstyvyfmlj.supabase.co/rest/v1/tarefas"
        const apikey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRncGd5aHZneHdrc3R5dnlmbWxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTEyNjksImV4cCI6MjA5NjUyNzI2OX0.cZycg2P6be2YsEdIPyuckOn-9jieeIarSbPhbEUgD9c"

        window.onload = function () {
            const req = new XMLHttpRequest();
            req.open("GET", url);
            req.setRequestHeader("apikey", apikey);
            req.send();
            req.onload = function () {
                const tarefas = JSON.parse(req.response);
                const tabela = document.getElementById("dadosTabelas");

                tabela.innerHTML = ""; 
                for(let item of tarefas) {
                    const tr = document.createElement("tr");
                    const td_Id = document.createElement("td");
                    td_Id.textContent = item.id;
                    const td_Nome = document.createElement("td");
                    td_Nome.textContent = item.descricao;
                    const td_Prioridade = document.createElement("td");
                    td_Prioridade.textContent = item.prioridade;
                    tr.appendChild(td_Id);
                    tr.appendChild(td_Nome);
                    tr.appendChild(td_Prioridade);
                    tabela.appendChild(tr);
                }
            };

            getTarefas()
        };

        async function getTarefas() {
            const listaTarefas = await fetch(url, {
                headers: {
                    "apikey": apikey
                }
            }).then(response => response.json())
            console.log(listaTarefas)
        }
    </script>
</body>

</html>
