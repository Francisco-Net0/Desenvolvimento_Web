<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 06/03</title>
</head>
<body>
    <h2>Image Player</h2>
    <a href="Arquivos/new_york.jpg">
        <img src="Arquivos/new_york.jpg" alt="New York" title="New York City" height="300" width="400">
    </a>

    <hr>

    <h2>Audio Player</h2>
    <audio src="Arquivos/music.mp3" controls></audio>

    <hr>

    <h2>Video Player</h2>
    <video src="Arquivos/ondas.mp4" controls height="300" width="400"></video>

    <video controls height="300" width="400">
        <source src="Arquivos/ondas.mp4" type="video/mp4">
        <track label="Portuguese" kind="subtitles" srclang="pt-BR" src="legendas.vtt" default>
        <track label="Inglês" kind="subtitles" srclang="en" src="legendas2.vtt">
    </video>
</body>
</html>
