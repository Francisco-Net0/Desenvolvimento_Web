<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 25/05</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <style>
        #conteudo {
            margin-top: 20px;
        }

        #titulo {
            text-align: center;
        }

        #subtitulo {
            text-align: center;
            font-size: 30px
        }

        button {
            margin-top: 15px;
            border-radius: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            background: #f9fafc;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .btns button {
            width: auto;
            margin-left: 5px;
            padding: 5px 8px;
            font-size: 12px;
        }

        .edit {
            background: orange;
        }

        .delete {
            background: red;
        }
    </style>
</head>

<body>
    <div id="conteudo" class="container">
        <h1 id="titulo">Aula 25/05</h1>

        <label for="nomecurso">Nome do Curso:</label>
        <input class="form-control" type="text" name="nomecurso" id="nomecurso">
        <label for="sigla">Sigla do Curso</label>
        <input class="form-control" type="text" name="sigla" id="sigla">
        <div class="d-flex justify-content-center">
            <button class="btn btn-primary mb-3" type="button" id="btnAdicionar">Adicionar</button>
        </div>

        <hr>

        <div>
            <h1 id="subtitulo">Lista de Cursos</h1>
            <ul id="listaCursos"></ul>
        </div>

        <hr>

        <div>
            <h1 id="subtitulo">Remover</h1>
            <label for="cursoid">Informe o Id do Curso:</label>
            <input class="form-control" type="text" name="cursoid" id="cursoid">
            <button class="btn btn-primary mb-3" type="button" id="btnRemover">Remover</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
